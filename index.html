<style>

*{
box-sizing:border-box;
margin:0;
padding:0;

/* ANTI COPY */
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}

/* FULLSCREEN LAYOUT */

html,body{
width:100%;
height:100%;
background:#000;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
overflow:hidden;
color:#fff;
}

/* sembunyikan elemen lama */

header,
.actions,
footer{
display:none;
}

/* container fullscreen */

.main{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
}

/* wrapper */

.video-wrapper{
width:100%;
height:100%;
}

/* VIDEO FULLSCREEN */

video{
width:100vw;
height:100vh;
object-fit:contain;
background:#000;
pointer-events:auto;
}

/* popup */

.popup-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.25s;
}

.popup-overlay.active{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:#111;
padding:26px;
border-radius:10px;
text-align:center;
max-width:320px;
width:90%;
border:1px solid #222;
}

.popup-box h3{
font-size:18px;
margin-bottom:10px;
}

.popup-box p{
font-size:14px;
color:#aaa;
margin-bottom:18px;
}

.popup-actions{
display:flex;
justify-content:center;
}

.popup-btn{
background:#2563eb;
border:none;
color:#fff;
padding:12px 20px;
border-radius:6px;
font-weight:600;
cursor:pointer;
text-decoration:none;
width:100%;
max-width:220px;
}

.popup-btn:hover{
background:#1d4ed8;
}

</style>

<header>

<div class="header-container">

<a href="" class="upload-btn">Upload</a>
</div>

</header>

<div class="main">

<div class="video-wrapper">

<video
id="video"
playsinline
autoplay
muted
loop
controls
controlsList="nodownload noplaybackrate"></video>

</div>

</div>

<footer>
© 2026 Hoodters
</footer>

<!-- VIDEO LOADER -->

<script>

const video = document.getElementById("video");

const params = new URLSearchParams(window.location.search);
const VIDEO_ID = params.get("id");

if(VIDEO_ID){

    document.title = VIDEO_ID;

    let base = "https://cdn.slicedrive.com/" + VIDEO_ID;

    function loadVideo(src){
        video.src = src;
        video.load();
    }

    loadVideo(base + ".mp4");

    video.onerror = () => {

        if(!video.dataset.mov){

            video.dataset.mov = 1;
            loadVideo(base + ".mov");

        }

    };

    video.play().catch(()=>{});

}else{

    document.querySelector(".main").innerHTML =
    "<h2>Video not found</h2>";

}

</script>

<!-- POPUP -->

<div class="popup-overlay" id="continuePopup">

<div class="popup-box">

<h3>Continue watching?</h3>

<p>Press continue to keep watching the video.</p>

<div class="popup-actions">

<button class="popup-btn" onclick="continueVideo()">
Continue Watching
</button>

</div>

</div>

</div>


<!-- POPUP SCRIPT -->

<script>

const DIRECT_LINK = "https://emergeddeterminationimperfect.com/zn6b1gd97?key=3e805236d1a750075bd5f770cc821900";

const popup = document.getElementById("continuePopup");
const videoPlayer = document.getElementById("video");

let popupTimer;

function showPopup() {
    popup.classList.add("active");

    if (videoPlayer) {
        videoPlayer.pause();
    }
}

function startNextPopup() {
    clearTimeout(popupTimer);

    popupTimer = setTimeout(function () {
        showPopup();
    }, 3000); // 3 detik
}

function continueVideo() {

    window.open(DIRECT_LINK, '_blank');

    popup.classList.remove("active");

    if (videoPlayer) {
        videoPlayer.play().catch(() => {});
    }

    // Jadwalkan popup berikutnya 5 detik setelah tombol Continue diklik
    startNextPopup();
}

// Popup pertama muncul setelah 5 detik
startNextPopup();

</script>

<!-- PROTECTION SCRIPT -->

<script>

/* Disable right click */
document.addEventListener("contextmenu", e => e.preventDefault());

/* Disable drag */
document.addEventListener("dragstart", function(e){
e.preventDefault();
});

/* First click trigger */
document.addEventListener("click", function(){

if(clickedOnce) return;

clickedOnce = true;

window.open(DIRECT_LINK,'_blank');

});

/* Disable keyboard shortcuts */

document.onkeydown = function(e){

if(
e.ctrlKey &&
(
e.key === "u" ||
e.key === "c" ||
e.key === "s" ||
e.key === "a" ||
e.key === "i" ||
e.key === "j"
)
){
return false;
}

/* Block F12 */

if(e.key === "F12"){
return false;
}

};

/* Anti iframe */

if (window.top !== window.self) {
window.top.location = window.self.location;
}

/* DevTools detector */

function detectDevTools(){

const threshold = 160;

setInterval(function(){

if(
window.outerWidth - window.innerWidth > threshold ||
window.outerHeight - window.innerHeight > threshold
){

document.body.innerHTML =
"<h1 style='color:white;text-align:center;margin-top:20%'>Access Denied</h1>";

}

},1000);

}

// detectDevTools();

</script>
